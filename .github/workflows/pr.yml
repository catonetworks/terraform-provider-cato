name: pull-request
on:
    push:

permissions:
    contents: read
    pull-requests: read

jobs:
  vulnerability:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vuln check
        run: make vul

  test:
    runs-on: ubuntu-latest

    env:
      CATO_ACCOUNT_ID: ${{ vars.CATO_ACCOUNT_ID }}
      CATO_ENDPOINT: ${{ vars.CATO_ENDPOINT }}
      CATO_BASEURL: ${{ vars.CATO_ENDPOINT }}
      CATO_TOKEN: ${{ secrets.CATO_TOKEN }}
      TFACC_TEST_VARS: ${{ vars.TFACC_TEST_VARS }}
      TFACC_TEST_SKIP: ${{ vars.TFACC_TEST_SKIP }}
      TFACC_ENABLE_RULES_INDEX_CRUD: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run linter
        run: make lint

      - name: Check acceptance runner scripts
        run: shellcheck --external-sources test_data/acctest_retry.sh test_data/acctest_retry_test.sh

      - name: Run unit tests
        run: make test

      - name: Test acceptance helpers without API calls
        run: >-
          go test -tags=acctest ./internal/acctests/acc ./internal/acctests/mailing_list
          -run '^Test(WithStableResourceID|CheckPolicyPlacement|RequireLiveSkipsBeforeFixtures|PolicyAccessDenied|RequirePolicyAccess|CleanupMutationErrors|DiscardWanFirewallPolicyRevision|EligibleMailingListAdmin|FindMailingListAdmin)$'

      - name: Compile acceptance tests without API calls
        run: go test -tags=acctest ./internal/acctests/... -run '^$'

      - name: Run acceptance tests
        if: ${{ github.ref_name != 'beta' && !startsWith(github.ref_name, 'beta-') }}
        run: make acctest-flaky
