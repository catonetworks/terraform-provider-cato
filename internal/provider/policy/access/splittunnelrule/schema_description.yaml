Attributes:
  - Name: "at"
    Description: "Position of the rule in the policy"
    Type: "nested"
    Mode: "optional"
    Attributes:
      - Name: "position"
        Description: "Position relative to a policy, a section or another rule"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=PolicyRulePositionEnum"
      - Name: "ref"
        Description: "The identifier of the object (e.g. a rule, a section) relative to which the position of the added rule is defined"
        Type: "string"
        Mode: "optional_computed"
        Hints:
          - "modifyPlan"
  - Name: "rule"
    Description: "Parameters for the rule you are adding"
    Type: "nested"
    Mode: "required"
    Attributes:
      - Name: "action"
        Description: "The action applied by the split tunnel if the rule is matched"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=SplitTunnelActionEnum"
      - Name: "country"
        Description: "Country traffic matching criteria. Logical ‘OR’ is applied within the criteria set. Logical ‘AND’ is applied between criteria sets."
        Type: "set"
        Mode: "required"
        ItemType: "nested"
        Attributes:
          - Name: "id"
            Description: "Referenced object ID"
            Type: "string"
            Mode: "optional_computed"
          - Name: "name"
            Description: "Referenced object name"
            Type: "string"
            Mode: "optional_computed"
        Hints:
          - "idName"
      - Name: "coverage"
        Description: "Coverage"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=SplitTunnelCoverageEnum"
      - Name: "description"
        Description: "Description"
        Type: "string"
        Mode: "required"
      - Name: "destination"
        Description: "Destination traffic matching criteria. Logical ‘OR’ is applied within the criteria set. Logical ‘AND’ is applied between criteria sets."
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "application"
            Description: "Applications for the rule (pre-defined)"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
          - Name: "domain"
            Description: "A Second-Level Domain (SLD). It matches all Top-Level Domains (TLD), and subdomains that include the Domain. Example: example.com."
            Type: "set"
            Mode: "required"
            ItemType: "string"
          - Name: "fqdn"
            Description: "An exact match of the fully qualified domain (FQDN). Example: www.my.example.com."
            Type: "set"
            Mode: "required"
            ItemType: "string"
          - Name: "global_ip_range"
            Description: "Globally defined IP range"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
      - Name: "dns_exclusion"
        Description: "Dns exclusion"
        Type: "nested"
        Mode: "optional"
        Attributes:
          - Name: "domain"
            Description: "A Second-Level Domain (SLD). It matches all Top-Level Domains (TLD), and subdomains that include the Domain. Example: example.com."
            Type: "set"
            Mode: "required"
            ItemType: "string"
      - Name: "enabled"
        Description: "Enabled"
        Type: "bool"
        Mode: "required"
      - Name: "id"
        Description: "Rule ID"
        Type: "string"
        Mode: "computed"
      - Name: "index"
        Description: "Current rule index"
        Type: "int64"
        Mode: "computed"
      - Name: "name"
        Description: "Name"
        Type: "string"
        Mode: "required"
      - Name: "platform"
        Description: "Source device Operating System traffic matching criteria. Logical ‘OR’ is applied within the criteria set. Logical ‘AND’ is applied between criteria sets."
        Type: "set"
        Mode: "required"
        ItemType: "string"
        Hints:
          - "enum=OperatingSystem"
      - Name: "routing_priority"
        Description: "Routing priority"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=SplitTunnelRoutingPriorityEnum"
      - Name: "section"
        Description: "Policy section containing the rule"
        Type: "nested"
        Mode: "computed"
        Attributes:
          - Name: "id"
            Description: "Section ID"
            Type: "string"
            Mode: "computed"
          - Name: "name"
            Description: "Section name"
            Type: "string"
            Mode: "computed"
      - Name: "source"
        Description: "Source traffic matching criteria. Logical ‘OR’ is applied within the criteria set. Logical ‘AND’ is applied between criteria sets."
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "user"
            Description: "Individual users defined for the account"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
          - Name: "users_group"
            Description: "Group of users"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
      - Name: "source_network"
        Description: "Source network"
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "source_network_type"
            Description: "Source network type"
            Type: "string"
            Mode: "required"
            Hints:
              - "enum=SplitTunnelSourceNetworkTypeEnum"
