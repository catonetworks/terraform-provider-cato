Attributes:
  - Name: "at"
    Description: "Position of the rule in the policy"
    Type: "nested"
    Mode: "optional"
    Attributes:
      - Name: "position"
        Description: "Position relative to a policy, a section or another rule"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=PolicyRulePositionEnum"
      - Name: "ref"
        Description: "The identifier of the object (e.g. a rule, a section) relative to which the position of the added rule is defined"
        Type: "string"
        Mode: "optional_computed"
        Hints:
          - "modifyPlan"
  - Name: "rule"
    Description: "Parameters for the rule you are adding"
    Type: "nested"
    Mode: "required"
    Attributes:
      - Name: "action"
        Description: "The action applied by the client connectivity if the rule is matched"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=ClientConnectivityActionEnum"
      - Name: "confidence_level"
        Description: "User confidence level"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=ClientConnectivityConfidenceLevelEnum"
      - Name: "connection_origin"
        Description: "Connection origin matching criteria. Logical 'OR' is applied within the criteria set. Logical 'AND' is applied between criteria sets."
        Type: "set"
        Mode: "required"
        ItemType: "string"
        Hints:
          - "enum=ClientConnectivityOriginEnum"
      - Name: "country"
        Description: "Country traffic matching criteria. Logical ‘OR’ is applied within the criteria set. Logical ‘AND’ is applied between criteria sets."
        Type: "set"
        Mode: "required"
        ItemType: "nested"
        Attributes:
          - Name: "id"
            Description: "Referenced object ID"
            Type: "string"
            Mode: "optional_computed"
          - Name: "name"
            Description: "Referenced object name"
            Type: "string"
            Mode: "optional_computed"
        Hints:
          - "idName"
      - Name: "description"
        Description: "Description"
        Type: "string"
        Mode: "required"
      - Name: "device"
        Description: "Device Profile traffic matching criteria. Logical ‘OR’ is applied within the criteria set. Logical ‘AND’ is applied between criteria sets."
        Type: "set"
        Mode: "required"
        ItemType: "nested"
        Attributes:
          - Name: "id"
            Description: "Referenced object ID"
            Type: "string"
            Mode: "optional_computed"
          - Name: "name"
            Description: "Referenced object name"
            Type: "string"
            Mode: "optional_computed"
        Hints:
          - "idName"
      - Name: "enabled"
        Description: "Enabled"
        Type: "bool"
        Mode: "required"
      - Name: "id"
        Description: "Rule ID"
        Type: "string"
        Mode: "computed"
      - Name: "index"
        Description: "Current rule index"
        Type: "int64"
        Mode: "computed"
      - Name: "name"
        Description: "Name"
        Type: "string"
        Mode: "required"
      - Name: "platform"
        Description: "Source device Operating System traffic matching criteria. Logical ‘OR’ is applied within the criteria set. Logical ‘AND’ is applied between criteria sets."
        Type: "set"
        Mode: "required"
        ItemType: "string"
        Hints:
          - "enum=OperatingSystem"
      - Name: "section"
        Description: "Policy section containing the rule"
        Type: "nested"
        Mode: "computed"
        Attributes:
          - Name: "id"
            Description: "Section ID"
            Type: "string"
            Mode: "computed"
          - Name: "name"
            Description: "Section name"
            Type: "string"
            Mode: "computed"
      - Name: "source"
        Description: "Source traffic matching criteria. Logical ‘OR’ is applied within the criteria set. Logical ‘AND’ is applied between criteria sets."
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "user"
            Description: "Individual users defined for the account"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
          - Name: "users_group"
            Description: "Group of users"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
      - Name: "source_range"
        Description: "Public ISP IP Range matching criteria."
        Type: "set"
        Mode: "required"
        ItemType: "nested"
        Attributes:
          - Name: "global_ip_range"
            Description: "Globally defined IP range"
            Type: "nested"
            Mode: "required"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
