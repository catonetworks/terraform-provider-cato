Attributes:
  - Name: "at"
    Description: "Position of the rule in the policy"
    Type: "nested"
    Mode: "optional"
    Attributes:
      - Name: "position"
        Description: "Position relative to a policy, a section or another rule"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=PolicyRulePositionEnum"
      - Name: "ref"
        Description: "The identifier of the object (e.g. a rule, a section) relative to which the position of the added rule is defined"
        Type: "string"
        Mode: "optional_computed"
        Hints:
          - "modifyPlan"
  - Name: "rule"
    Description: "Parameters for the rule you are adding"
    Type: "nested"
    Mode: "required"
    Attributes:
      - Name: "allowed_host_ip"
        Description: "Allowed Host IP range. all the other IPs will be blocked by the pop. Globally defined IP range"
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "id"
            Description: "Referenced object ID"
            Type: "string"
            Mode: "optional_computed"
          - Name: "name"
            Description: "Referenced object name"
            Type: "string"
            Mode: "optional_computed"
        Hints:
          - "idName"
      - Name: "description"
        Description: "Description"
        Type: "string"
        Mode: "required"
      - Name: "enabled"
        Description: "Enabled"
        Type: "bool"
        Mode: "required"
      - Name: "exclude_traffic"
        Description: "Exclude traffic IP Range. all traffic to those Ips will be excluded from the GRE tunnel. Globally defined IP range"
        Type: "set"
        Mode: "required"
        ItemType: "nested"
        Attributes:
          - Name: "id"
            Description: "Referenced object ID"
            Type: "string"
            Mode: "optional_computed"
          - Name: "name"
            Description: "Referenced object name"
            Type: "string"
            Mode: "optional_computed"
        Hints:
          - "idName"
      - Name: "id"
        Description: "Rule ID"
        Type: "string"
        Mode: "computed"
      - Name: "index"
        Description: "Current rule index"
        Type: "int64"
        Mode: "computed"
      - Name: "name"
        Description: "Name"
        Type: "string"
        Mode: "required"
      - Name: "section"
        Description: "Policy section containing the rule"
        Type: "nested"
        Mode: "computed"
        Attributes:
          - Name: "id"
            Description: "Section ID"
            Type: "string"
            Mode: "computed"
          - Name: "name"
            Description: "Section name"
            Type: "string"
            Mode: "computed"
