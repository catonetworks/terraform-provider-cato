Attributes:
  - Name: "department"
    Description: "Department"
    Type: "string"
    Mode: "optional_computed"
    Hints:
      - "modifyPlan"
  - Name: "display_name"
    Description: "Display name returned by the API"
    Type: "string"
    Mode: "computed"
  - Name: "email"
    Description: "Email"
    Type: "string"
    Mode: "required"
  - Name: "enabled"
    Description: "Whether the local user is enabled. Defaults to true."
    Type: "bool"
    Mode: "optional_computed"
    Hints:
      - "default=true"
      - "separateEnableDisable"
  - Name: "first_name"
    Description: "First name"
    Type: "string"
    Mode: "required"
  - Name: "id"
    Description: "Resource ID"
    Type: "string"
    Mode: "computed"
  - Name: "job_title"
    Description: "Job title"
    Type: "string"
    Mode: "optional_computed"
    Hints:
      - "modifyPlan"
  - Name: "last_name"
    Description: "Last name"
    Type: "string"
    Mode: "required"
  - Name: "phone_number"
    Description: "Phone number"
    Type: "string"
    Mode: "optional_computed"
    Hints:
      - "modifyPlan"
  - Name: "user_import_type"
    Description: "User source; only local users can be managed"
    Type: "string"
    Mode: "computed"
  - Name: "user_status"
    Description: "Current user status"
    Type: "string"
    Mode: "computed"
