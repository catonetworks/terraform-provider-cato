Attributes:
  - Name: "downstream_bw_limit"
    Description: "Downstream bw limit"
    Type: "string"
    Mode: "required"
  - Name: "encapsulation_method"
    Description: "Encapsulation method"
    Type: "string"
    Mode: "required"
    Hints:
      - "enum=TaggingMethod"
  - Name: "ha_role"
    Description: "Ha role"
    Type: "string"
    Mode: "required"
    Hints:
      - "enum=HaRole"
      - "requiresReplace"
  - Name: "id"
    Description: "Resource ID"
    Type: "string"
    Mode: "computed"
  - Name: "pop_location"
    Description: "Pop location"
    Type: "nested"
    Mode: "required"
    Attributes:
      - Name: "id"
        Description: "Referenced object ID"
        Type: "string"
        Mode: "optional_computed"
      - Name: "name"
        Description: "Referenced object name"
        Type: "string"
        Mode: "optional_computed"
    Hints:
      - "idName"
  - Name: "private_cato_ip"
    Description: "Private cato ip"
    Type: "string"
    Mode: "required"
  - Name: "private_site_ip"
    Description: "Private site ip"
    Type: "string"
    Mode: "required"
  - Name: "qinq_vlan_configuration"
    Description: "QINQ tags. Omit to use the API allocation; assigned values are returned in state."
    Type: "nested"
    Mode: "optional_computed"
    Attributes:
      - Name: "c_vlan"
        Description: "C vlan"
        Type: "int64"
        Mode: "required"
        Hints:
          - "scalar=Vlan"
          - "range=1..4094"
      - Name: "s_vlan"
        Description: "S vlan"
        Type: "int64"
        Mode: "required"
        Hints:
          - "scalar=Vlan"
          - "range=1..4094"
  - Name: "service_provider_name"
    Description: "Service provider name"
    Type: "string"
    Mode: "required"
  - Name: "site"
    Description: "Site"
    Type: "nested"
    Mode: "required"
    Attributes:
      - Name: "id"
        Description: "Referenced object ID"
        Type: "string"
        Mode: "optional_computed"
      - Name: "name"
        Description: "Referenced object name"
        Type: "string"
        Mode: "optional_computed"
    Hints:
      - "idName"
      - "requiresReplace"
  - Name: "subnet"
    Description: "Subnet"
    Type: "string"
    Mode: "required"
  - Name: "upstream_bw_limit"
    Description: "Upstream bw limit"
    Type: "string"
    Mode: "required"
  - Name: "vlan"
    Description: "DOT1Q VLAN. Omit to use the API allocation; assigned value is returned in state."
    Type: "int64"
    Mode: "optional_computed"
    Hints:
      - "scalar=Vlan"
      - "range=1..4094"
