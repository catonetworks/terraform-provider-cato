Attributes:
  - Name: "band"
    Description: "Band"
    Type: "string"
    Mode: "required"
    Hints:
      - "enum=WifiRadioBand"
  - Name: "category"
    Description: "Category"
    Type: "string"
    Mode: "required"
    Hints:
      - "enum=WifiSsidCategory"
  - Name: "dhcp"
    Description: "Dhcp"
    Type: "nested"
    Mode: "optional"
    Attributes:
      - Name: "dhcp_subnet"
        Description: "Dhcp subnet"
        Type: "string"
        Mode: "optional_computed"
        Hints:
          - "modifyPlan"
  - Name: "dhcp_enabled"
    Description: "Dhcp enabled"
    Type: "bool"
    Mode: "optional_computed"
    Hints:
      - "modifyPlan"
  - Name: "enabled"
    Description: "Enabled"
    Type: "bool"
    Mode: "optional_computed"
    Hints:
      - "modifyPlan"
      - "apiDefault=true"
  - Name: "id"
    Description: "Resource ID"
    Type: "string"
    Mode: "computed"
  - Name: "internet_only"
    Description: "Internet only"
    Type: "bool"
    Mode: "optional_computed"
    Hints:
      - "modifyPlan"
  - Name: "local_ip"
    Description: "Local ip"
    Type: "string"
    Mode: "required"
  - Name: "mdns_enabled"
    Description: "Mdns enabled"
    Type: "bool"
    Mode: "required"
    Hints:
      - "apiDefault=false"
  - Name: "microsegmentation_enabled"
    Description: "Microsegmentation enabled"
    Type: "bool"
    Mode: "required"
    Hints:
      - "apiDefault=false"
  - Name: "name"
    Description: "Name"
    Type: "string"
    Mode: "required"
  - Name: "network_interface_id"
    Description: "Network interface id"
    Type: "string"
    Mode: "required"
    Hints:
      - "requiresReplace"
  - Name: "security"
    Description: "Security"
    Type: "nested"
    Mode: "required"
    Attributes:
      - Name: "auth_protocol"
        Description: "Auth protocol"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=WifiAuthProtocol"
          - "apiDefault=WPA3"
      - Name: "mode"
        Description: "Mode"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=WifiSecurityMode"
      - Name: "psk"
        Description: "Psk"
        Type: "nested"
        Mode: "optional"
        Attributes:
          - Name: "passkey"
            Description: "Passkey"
            Type: "string"
            Mode: "required"
            Hints:
              - "sensitive"
      - Name: "track_authentication"
        Description: "Track authentication"
        Type: "bool"
        Mode: "optional_computed"
        Hints:
          - "modifyPlan"
  - Name: "site"
    Description: "Site"
    Type: "nested"
    Mode: "required"
    Attributes:
      - Name: "id"
        Description: "Referenced object ID"
        Type: "string"
        Mode: "optional_computed"
      - Name: "name"
        Description: "Referenced object name"
        Type: "string"
        Mode: "optional_computed"
    Hints:
      - "idName"
      - "requiresReplace"
  - Name: "subnet"
    Description: "Subnet"
    Type: "string"
    Mode: "required"
  - Name: "visible"
    Description: "Visible"
    Type: "bool"
    Mode: "optional_computed"
    Hints:
      - "modifyPlan"
      - "apiDefault=true"
