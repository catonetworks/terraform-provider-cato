Attributes:
  - Name: "description"
    Description: "Description"
    Type: "string"
    Mode: "optional_computed"
    Hints:
      - "modifyPlan"
  - Name: "id"
    Description: "Resource ID"
    Type: "string"
    Mode: "computed"
  - Name: "ip"
    Description: "Allocated public IP address"
    Type: "string"
    Mode: "computed"
  - Name: "pop_location"
    Description: "Pop location"
    Type: "nested"
    Mode: "optional"
    Attributes:
      - Name: "id"
        Description: "Referenced object ID"
        Type: "string"
        Mode: "optional_computed"
      - Name: "name"
        Description: "Referenced object name"
        Type: "string"
        Mode: "optional_computed"
    Hints:
      - "idName"
      - "requiresReplace"
      - "apiDefault"
  - Name: "state"
    Description: "Allocation state returned by the API"
    Type: "string"
    Mode: "computed"
  - Name: "subnet"
    Description: "Allocated subnet returned by the API"
    Type: "string"
    Mode: "computed"
  - Name: "type"
    Description: "Type"
    Type: "string"
    Mode: "required"
    Hints:
      - "enum=PopLocationAllocatedIPType"
      - "apiDefault=BYOIP"
      - "requiresReplace"
