Attributes:
  - Name: "id"
    Description: "Resource ID"
    Type: "string"
    Mode: "computed"
  - Name: "name"
    Description: "Name"
    Type: "string"
    Mode: "required"
  - Name: "url"
    Description: "Destination URL the webhook request is sent to"
    Type: "string"
    Mode: "required"
  - Name: "enabled"
    Description: "Whether the webhook is enabled"
    Type: "bool"
    Mode: "optional_computed"
  - Name: "request_method"
    Description: "HTTP request method (POST or PUT)"
    Type: "string"
    Mode: "optional_computed"
  - Name: "body"
    Description: "Request body payload template"
    Type: "string"
    Mode: "required"
    Hints:
      - "sensitive"
      - "writeOnly"
  - Name: "auth"
    Description: "Authentication configuration; exactly one of basic/bearer/custom"
    Type: "object"
    Mode: "required"
    Hints:
      - "writeOnly"
    Attributes:
      - Name: "basic"
        Description: "HTTP Basic authentication"
        Type: "object"
        Mode: "optional"
        Attributes:
          - Name: "username"
            Description: "Username"
            Type: "string"
            Mode: "required"
          - Name: "password"
            Description: "Password"
            Type: "string"
            Mode: "required"
            Hints:
              - "sensitive"
      - Name: "bearer"
        Description: "Bearer token authentication"
        Type: "object"
        Mode: "optional"
        Attributes:
          - Name: "bearer_token"
            Description: "Bearer token"
            Type: "string"
            Mode: "required"
            Hints:
              - "sensitive"
      - Name: "custom"
        Description: "Custom header authentication"
        Type: "object"
        Mode: "optional"
        Attributes:
          - Name: "name"
            Description: "Header name"
            Type: "string"
            Mode: "required"
          - Name: "value"
            Description: "Header value"
            Type: "string"
            Mode: "required"
            Hints:
              - "sensitive"
  - Name: "header"
    Description: "Additional HTTP headers sent with the request"
    Type: "list"
    Mode: "optional"
    ItemType: "nested"
    Attributes:
      - Name: "name"
        Description: "Header name"
        Type: "string"
        Mode: "required"
      - Name: "value"
        Description: "Header value"
        Type: "string"
        Mode: "required"
  - Name: "response_mapping"
    Description: "Key/value pairs mapped out of the webhook response"
    Type: "list"
    Mode: "optional"
    ItemType: "nested"
    Attributes:
      - Name: "key"
        Description: "Mapping key"
        Type: "string"
        Mode: "required"
      - Name: "value"
        Description: "Mapping value"
        Type: "string"
        Mode: "required"
  - Name: "related_webhook_ref"
    Description: "Reference to a related webhook by ID or name"
    Type: "object"
    Mode: "optional"
    Hints:
      - "writeOnly"
    Attributes:
      - Name: "by"
        Description: "Reference kind: ID or NAME"
        Type: "string"
        Mode: "required"
      - Name: "input"
        Description: "The referenced webhook's ID or name, matching by"
        Type: "string"
        Mode: "required"
