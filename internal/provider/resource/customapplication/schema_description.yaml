Attributes:
  - Name: "category"
    Description: "Category"
    Type: "set"
    Mode: "optional_computed"
    ItemType: "nested"
    Attributes:
      - Name: "id"
        Description: "Referenced object ID"
        Type: "string"
        Mode: "optional_computed"
      - Name: "name"
        Description: "Referenced object name"
        Type: "string"
        Mode: "optional_computed"
    Hints:
      - "idName"
      - "modifyPlan"
  - Name: "criteria"
    Description: "Criteria"
    Type: "set"
    Mode: "required"
    ItemType: "nested"
    Attributes:
      - Name: "destination"
        Description: "Destination"
        Type: "nested"
        Mode: "optional"
        Attributes:
          - Name: "destination_ip"
            Description: "Destination ip"
            Type: "nested"
            Mode: "optional"
            Attributes:
              - Name: "ip"
                Description: "Ip"
                Type: "set"
                Mode: "optional_computed"
                ItemType: "string"
                Hints:
                  - "modifyPlan"
              - Name: "ip_range"
                Description: "Ip range"
                Type: "set"
                Mode: "optional_computed"
                ItemType: "nested"
                Attributes:
                  - Name: "from"
                    Description: "From"
                    Type: "string"
                    Mode: "required"
                  - Name: "to"
                    Description: "To"
                    Type: "string"
                    Mode: "required"
                Hints:
                  - "modifyPlan"
              - Name: "subnet"
                Description: "Subnet"
                Type: "set"
                Mode: "optional_computed"
                ItemType: "string"
                Hints:
                  - "modifyPlan"
          - Name: "domain"
            Description: "Domain"
            Type: "set"
            Mode: "optional_computed"
            ItemType: "string"
            Hints:
              - "modifyPlan"
          - Name: "fqdn"
            Description: "Fqdn"
            Type: "set"
            Mode: "optional_computed"
            ItemType: "string"
            Hints:
              - "modifyPlan"
      - Name: "port"
        Description: "Port"
        Type: "set"
        Mode: "required"
        ItemType: "string"
      - Name: "port_range"
        Description: "Port range"
        Type: "set"
        Mode: "required"
        ItemType: "nested"
        Attributes:
          - Name: "from"
            Description: "From"
            Type: "string"
            Mode: "required"
          - Name: "to"
            Description: "To"
            Type: "string"
            Mode: "required"
      - Name: "protocol"
        Description: "Protocol"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=IPProtocol"
          - "apiDefault=ANY"
  - Name: "description"
    Description: "Description"
    Type: "string"
    Mode: "optional_computed"
    Hints:
      - "modifyPlan"
  - Name: "id"
    Description: "Resource ID"
    Type: "string"
    Mode: "computed"
  - Name: "name"
    Description: "Name"
    Type: "string"
    Mode: "required"
