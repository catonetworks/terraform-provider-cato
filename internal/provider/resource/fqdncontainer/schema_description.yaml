Attributes:
  - Name: "description"
    Description: "Description"
    Type: "string"
    Mode: "required"
  - Name: "file_type"
    Description: "File type"
    Type: "string"
    Mode: "optional"
    Hints:
      - "enum=ContainerFileType"
      - "apiDefault=CSV"
      - "requiredIf=mode:URL"
      - "conflictsWith=values"
  - Name: "id"
    Description: "Resource ID"
    Type: "string"
    Mode: "computed"
  - Name: "mode"
    Description: "Container ownership mode: INLINE owns values; URL owns sync configuration."
    Type: "string"
    Mode: "required"
    Hints:
      - "oneOf=INLINE,URL"
      - "requiresReplace"
  - Name: "name"
    Description: "Name"
    Type: "string"
    Mode: "required"
    Hints:
      - "requiresReplace"
  - Name: "size"
    Description: "Number of entries reported by the API"
    Type: "int64"
    Mode: "computed"
  - Name: "sync_data"
    Description: "Sync data"
    Type: "nested"
    Mode: "optional"
    Attributes:
      - Name: "notifications"
        Description: "Notifications"
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "mailing_list"
            Description: "Mailing list"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
              - "apiDefault=[]"
          - Name: "subscription_group"
            Description: "Subscription group"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
              - "apiDefault=[]"
          - Name: "webhook"
            Description: "Webhook"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
              - "apiDefault=[]"
      - Name: "time_interval"
        Description: "Time interval"
        Type: "int64"
        Mode: "required"
      - Name: "time_unit"
        Description: "Time unit"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=ContainerSyncDataTimeUnit"
      - Name: "url"
        Description: "Url"
        Type: "string"
        Mode: "required"
    Hints:
      - "requiredIf=mode:URL"
      - "conflictsWith=values"
  - Name: "values"
    Description: "Values"
    Type: "set"
    Mode: "optional"
    ItemType: "string"
    Hints:
      - "requiredIf=mode:INLINE"
      - "conflictsWith=sync_data"
