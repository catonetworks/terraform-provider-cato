Attributes:
  - Name: "at"
    Description: "At"
    Type: "nested"
    Mode: "optional"
    Attributes:
      - Name: "position"
        Description: "Position"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=PolicyRulePositionEnum"
      - Name: "ref"
        Description: "Ref"
        Type: "string"
        Mode: "optional_computed"
        Hints:
          - "modifyPlan"
  - Name: "rule"
    Description: "Rule"
    Type: "nested"
    Mode: "required"
    Attributes:
      - Name: "allowed_destination_protocol"
        Description: "Allowed destination protocol"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=SiteWebProxyAllowedDestinationProtocol"
          - "apiDefault=BOTH"
      - Name: "associated_site"
        Description: "Associated site"
        Type: "set"
        Mode: "required"
        ItemType: "nested"
        Attributes:
          - Name: "id"
            Description: "Referenced object ID"
            Type: "string"
            Mode: "optional_computed"
          - Name: "name"
            Description: "Referenced object name"
            Type: "string"
            Mode: "optional_computed"
        Hints:
          - "idName"
          - "apiDefault=[]"
      - Name: "authentication_config"
        Description: "Authentication config"
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "kerberos_config"
            Description: "Kerberos config"
            Type: "nested"
            Mode: "optional"
            Attributes:
              - Name: "encrypted_keytab"
                Description: "Encrypted keytab"
                Type: "string"
                Mode: "optional_computed"
                Hints:
                  - "modifyPlan"
                  - "sensitive"
              - Name: "is_enabled"
                Description: "Is enabled"
                Type: "bool"
                Mode: "required"
                Hints:
                  - "apiDefault=false"
            Hints:
              - "apiDefault={isEnabled:false}"
          - Name: "method"
            Description: "Method"
            Type: "string"
            Mode: "required"
            Hints:
              - "enum=SiteWebProxyAuthMethod"
        Hints:
          - "apiDefault={kerberosConfig:{isEnabled:false}}"
      - Name: "description"
        Description: "Description"
        Type: "string"
        Mode: "required"
        Hints:
          - "apiDefault=\"\""
      - Name: "enabled"
        Description: "Enabled"
        Type: "bool"
        Mode: "required"
      - Name: "fqdn"
        Description: "Fqdn"
        Type: "string"
        Mode: "required"
      - Name: "id"
        Description: "Rule ID"
        Type: "string"
        Mode: "computed"
      - Name: "index"
        Description: "Current rule index"
        Type: "int64"
        Mode: "computed"
      - Name: "name"
        Description: "Name"
        Type: "string"
        Mode: "required"
      - Name: "port"
        Description: "Port"
        Type: "string"
        Mode: "required"
      - Name: "section"
        Description: "Policy section containing the rule"
        Type: "nested"
        Mode: "computed"
        Attributes:
          - Name: "id"
            Description: "Section ID"
            Type: "string"
            Mode: "computed"
          - Name: "name"
            Description: "Section name"
            Type: "string"
            Mode: "computed"
      - Name: "should_associate_with_all_sites"
        Description: "Should associate with all sites"
        Type: "bool"
        Mode: "required"
        Hints:
          - "apiDefault=false"
