Attributes:
  - Name: "at"
    Description: "At"
    Type: "nested"
    Mode: "optional"
    Attributes:
      - Name: "position"
        Description: "Position"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=PolicyRulePositionEnum"
      - Name: "ref"
        Description: "Ref"
        Type: "string"
        Mode: "optional_computed"
        Hints:
          - "modifyPlan"
  - Name: "rule"
    Description: "Rule"
    Type: "nested"
    Mode: "required"
    Attributes:
      - Name: "description"
        Description: "Description"
        Type: "string"
        Mode: "required"
        Hints:
          - "apiDefault=\"\""
      - Name: "enabled"
        Description: "Enabled"
        Type: "bool"
        Mode: "required"
      - Name: "external_ip"
        Description: "External ip"
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "id"
            Description: "Referenced object ID"
            Type: "string"
            Mode: "optional_computed"
          - Name: "name"
            Description: "Referenced object name"
            Type: "string"
            Mode: "optional_computed"
        Hints:
          - "idName"
      - Name: "external_port_range"
        Description: "External port range"
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "from"
            Description: "From"
            Type: "string"
            Mode: "required"
          - Name: "to"
            Description: "To"
            Type: "string"
            Mode: "required"
      - Name: "forward_icmp"
        Description: "Forward icmp"
        Type: "bool"
        Mode: "required"
        Hints:
          - "apiDefault=false"
      - Name: "id"
        Description: "Rule ID"
        Type: "string"
        Mode: "computed"
      - Name: "index"
        Description: "Current rule index"
        Type: "int64"
        Mode: "computed"
      - Name: "internal_ip"
        Description: "Internal ip"
        Type: "string"
        Mode: "required"
      - Name: "internal_port_range"
        Description: "Internal port range"
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "from"
            Description: "From"
            Type: "string"
            Mode: "required"
          - Name: "to"
            Description: "To"
            Type: "string"
            Mode: "required"
      - Name: "name"
        Description: "Name"
        Type: "string"
        Mode: "required"
      - Name: "remote_ips"
        Description: "Remote i ps"
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "global_ip_range"
            Description: "Global ip range"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
              - "apiDefault=[]"
          - Name: "ip"
            Description: "Ip"
            Type: "set"
            Mode: "required"
            ItemType: "string"
            Hints:
              - "apiDefault=[]"
          - Name: "ip_range"
            Description: "Ip range"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "from"
                Description: "From"
                Type: "string"
                Mode: "required"
              - Name: "to"
                Description: "To"
                Type: "string"
                Mode: "required"
            Hints:
              - "apiDefault=[]"
          - Name: "subnet"
            Description: "Subnet"
            Type: "set"
            Mode: "required"
            ItemType: "string"
            Hints:
              - "apiDefault=[]"
        Hints:
          - "apiDefault={ip:[],ipRange:[],subnet:[],globalIpRange:[]}"
      - Name: "restriction_type"
        Description: "Restriction type"
        Type: "string"
        Mode: "required"
        Hints:
          - "enum=RemotePortFwdRestrictionType"
          - "apiDefault=ALLOW_LIST"
      - Name: "section"
        Description: "Policy section containing the rule"
        Type: "nested"
        Mode: "computed"
        Attributes:
          - Name: "id"
            Description: "Section ID"
            Type: "string"
            Mode: "computed"
          - Name: "name"
            Description: "Section name"
            Type: "string"
            Mode: "computed"
      - Name: "tracking"
        Description: "Tracking"
        Type: "nested"
        Mode: "required"
        Attributes:
          - Name: "enabled"
            Description: "Enabled"
            Type: "bool"
            Mode: "required"
            Hints:
              - "apiDefault=false"
          - Name: "frequency"
            Description: "Frequency"
            Type: "string"
            Mode: "required"
            Hints:
              - "enum=PolicyRuleTrackingFrequencyEnum"
              - "apiDefault=HOURLY"
          - Name: "mailing_list"
            Description: "Mailing list"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
              - "apiDefault=[]"
          - Name: "subscription_group"
            Description: "Subscription group"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
              - "apiDefault=[]"
          - Name: "webhook"
            Description: "Webhook"
            Type: "set"
            Mode: "required"
            ItemType: "nested"
            Attributes:
              - Name: "id"
                Description: "Referenced object ID"
                Type: "string"
                Mode: "optional_computed"
              - Name: "name"
                Description: "Referenced object name"
                Type: "string"
                Mode: "optional_computed"
            Hints:
              - "idName"
              - "apiDefault=[]"
        Hints:
          - "apiDefault={enabled:false,frequency:HOURLY,subscriptionGroup:[],webhook:[],mailingList:[]}"
